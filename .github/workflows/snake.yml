name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # rebuilds daily at midnight UTC
  workflow_dispatch: {} # allows manual trigger from the Actions tab
  push:
    branches:
      - main

# Prevent overlapping runs from clobbering the output branch
concurrency:
  group: snake-animation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake assets (dark plum & cream palette)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235C2A4D&color_dots=%23FCF6EE,%23E4CFDD,%23C9A0BE,%23A0668F,%235C2A4D&color_empty=%23FCF6EE
            dist/github-contribution-grid-snake.gif?color_snake=%235C2A4D&color_dots=%23FCF6EE,%23E4CFDD,%23C9A0BE,%23A0668F,%235C2A4D&color_empty=%23FCF6EE

      - name: Deploy assets to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: update contribution snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
